    { url = "https://github.com/NovaSky-AI/skyrl-wheels/releases/download/cu13torch2.14-fa4b28-skyrl1/flash_attn-2.8.3.post1%2Bcu.13.0.torch.2.14.fa4b28.skyrl1-cp312-cp312-manylinux_2_24_aarch64.manylinux_2_28_aarch64.whl", marker = "sys_platform == 'linux' and platform_machine == 'aarch64' and python_version == '3.12'" },
