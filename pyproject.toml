[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["skyrl*"]

[project]
name = "skyrl"
dynamic = ["version"]
description = "Unified API for training and inference"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "datasets>=4.0.0",
    "pillow>=11.3.0",
    "rich>=14.1.0",
    "safetensors>=0.6.2",
    # Floor tracks the transformers pin below: transformers 5.16.1 requires
    # tokenizers>=0.23.1.
    "tokenizers>=0.23.1",
    "transformers>=5.6.1,<=5.16.1",
    "typer>=0.17.4",
    # Exact pin: peft 0.19.x turned a string `target_modules` such as "all-linear"
    # into a character set on MoE models (fixed by 0.21.0). Megatron-Bridge
    # requires peft>=0.20.0,<=0.21.0.
    "peft==0.21.0",
    "hf_transfer",
    "cloudpathlib>=0.23.0",
    "zstandard>=0.23.0",
    "xxhash>=3.0.0",
]

[project.optional-dependencies]
gpu = [
    "jax[cuda13]>=0.7.2; sys_platform == 'linux'",
]

tpu = [
    # libtpu is published for Linux x86_64, not Linux aarch64.
    "jax[tpu]>=0.7.2; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

tinker = [
    "tinker>=0.25.0,<0.28.0",
    "fastapi[standard]",
    "sqlmodel",
    "sqlalchemy[asyncio]",
    "aiosqlite",
    "asyncpg",
    "psycopg2-binary",
]

ray = [
    "ray[default]==2.57.0",
]

aws = [
    "cloudpathlib[s3]",
    "s5cmd>=0.3.3; sys_platform == 'linux'",
]

gcp = [
    "cloudpathlib[gs]",
]

azure = [
    "cloudpathlib[azure]",
]

# The extras "jax", "fsdp", and "megatron" are the dependencies the
# engine needs for --backend="jax", --backend="fsdp", and --backend="megatron",
# respectively.

jax = [
    "jax>=0.8,<1.0",
    "flax>=0.12.10",
    "optax>=0.2.5",
]

skyrl-train = [
    "loguru",
    "tqdm",
    "ninja",
    "tensorboard",
    "func_timeout",
    "hydra-core==1.3.4",
    "accelerate",
    "torchdata",
    "omegaconf",
    "ray==2.57.0",
    "peft==0.21.0",
    "debugpy==1.8.0",
    "hf_transfer",
    "wandb",
    "datasets>=4.0.0",
    "tensordict",
    "jaxtyping",
    "skyrl-gym",
    "flash-attn==2.8.3.post1; sys_platform == 'linux'",
    "polars",
    "s3fs",
    "s5cmd>=0.3.3; sys_platform == 'linux'",
    "gcsfs",
    "fastapi",
    "orjson>=3.11.9",
    "pybase64>=1.4.2",
    "uvicorn",
    "vllm-router; sys_platform == 'linux'",
    "pybind11",
    "setuptools",
    # The `nixl` shim provides that namespace and dispatches on `torch.version.cuda`,
    # so with a cu13 torch it loads `nixl_cu13`. `nixl-cu13` ships the `nixl_cu13`
    # module, but vLLM imports `nixl._api`. Its metadata hard-depends on `nixl-cu12`
    # too; that variant is overridden out below (it would drag the CUDA-12 runtime
    # into the image for a module the shim would never load).
    # vLLM 0.33's NixlConnector refuses NIXL < 1.5.0 at engine start (check_nixl_version);
    # vLLM does not declare nixl, so the floor lives here.
    "nixl>=1.5.0; sys_platform == 'linux'",
]

fsdp = [
    "skyrl[skyrl-train]",
    "vllm==0.33.0; sys_platform == 'linux'",
    "vllm-router; sys_platform == 'linux'",
    # The `nixl` shim provides that namespace and dispatches on `torch.version.cuda`,
    # so with a cu13 torch it loads `nixl_cu13`. `nixl-cu13` ships the `nixl_cu13`
    # module, but vLLM imports `nixl._api`. Its metadata hard-depends on `nixl-cu12`
    # too; that variant is overridden out below (it would drag the CUDA-12 runtime
    # into the image for a module the shim would never load).
    # vLLM 0.33's NixlConnector refuses NIXL < 1.5.0 at engine start (check_nixl_version);
    # vLLM does not declare nixl, so the floor lives here.
    "nixl>=1.5.0; sys_platform == 'linux'",
    # 0.6.0+: with 0.5.2 + Triton 3.7.1, fla autotunes the GDN chunk_fwd_kernel_o to 8 warps on B200 (sm_100),
    # which hits a Triton race (triton-lang/triton#10590) and corrupts GDN outputs in ~40% of calls.
    "flash-linear-attention==0.6.0; sys_platform == 'linux'",
    "causal-conv1d==1.7.0; sys_platform == 'linux'",
    "flash-attn==2.8.3.post1; sys_platform == 'linux'",
    "torch==2.14.0; sys_platform == 'linux'",
    "flashinfer-python==0.7.2.post1; sys_platform == 'linux'",
    "flashinfer-jit-cache==0.7.2.post1; sys_platform == 'linux'",
    "flashinfer-jit-cache-sm100a==0.7.2.post1; sys_platform == 'linux'",
    "flashinfer-jit-cache-sm103a==0.7.2.post1; sys_platform == 'linux'",
    "flashinfer-jit-cache-sm120f==0.7.2.post1; sys_platform == 'linux'",
    "flashinfer-jit-cache-sm80==0.7.2.post1; sys_platform == 'linux'",
    "flashinfer-jit-cache-sm89==0.7.2.post1; sys_platform == 'linux'",
    "flashinfer-jit-cache-sm90a==0.7.2.post1; sys_platform == 'linux'",
    "flashinfer-jit-cache-sm110a==0.7.2.post1; sys_platform == 'linux' and platform_machine == 'aarch64'",
    "flashinfer-jit-cache-sm121a==0.7.2.post1; sys_platform == 'linux' and platform_machine == 'aarch64'",
    "flashinfer-cubin==0.7.2.post1; sys_platform == 'linux'",
    "torchvision; sys_platform == 'linux'",
]

qlora = [
    "bitsandbytes>=0.47.0; sys_platform == 'linux'",
]

megatron = [
    "skyrl[skyrl-train]",
    "transformer-engine[pytorch]==2.19.0; sys_platform == 'linux'",
    # Declared directly (not just via transformer-engine[pytorch]) so the
    # [tool.uv.sources] index below is honored — uv ignores sources for
    # transitive-only packages, which would otherwise fall back to the PyPI sdist.
    # Astral's build for this torch, pinned with its local segment so uv cannot pick
    # another torch's build of the same version.
    "transformer-engine-torch==2.19.0+cu.13.0.torch.2.14; sys_platform == 'linux'",
    # TE core CUDA lib (libtransformer_engine.so). Declared directly because the
    # meta package only pulls a core via its `core*` extras, which we don't request
    # — without it the meta package's sanity check fails with "Found empty
    # `transformer-engine` meta package installed". cu13 is what
    # `transformer-engine-torch`'s metadata requires under a cu13 torch, so the two
    # agree without an override. Astral's transformer-engine-torch hard-depends on
    # Astral's own core build (`==2.19.0+cu.13.0`), so the core -- and the meta package,
    # whose version check must tolerate that local segment -- come from Astral too;
    # see [tool.uv.sources].
    "transformer-engine-cu13==2.19.0+cu.13.0; sys_platform == 'linux'",
    "flash-attn==2.8.3.post1; sys_platform == 'linux'",
    # 0.6.0+: with 0.5.2 + Triton 3.7.1, fla autotunes the GDN chunk_fwd_kernel_o to 8 warps on B200 (sm_100),
    # which hits a Triton race (triton-lang/triton#10590) and corrupts GDN outputs in ~40% of calls.
    "flash-linear-attention==0.6.0; sys_platform == 'linux'",
    "causal-conv1d==1.7.0; sys_platform == 'linux'",
    "mamba-ssm==2.3.2.post1+cu.13.0.torch.2.14; sys_platform == 'linux'",
    # FlashMLA sparse-attention forward for megatron-core's `dsa_kernel_backend="cudnn"` DSA path
    # (imported lazily as `flash_mla.flash_mla_sparse_fwd`). Not on PyPI: our own build of the
    # `nv_dev` branch (x86_64 and aarch64), see [tool.uv.sources].
    "flash-mla==1.0.0+cu.13.0.torch.2.14.b7643bd; sys_platform == 'linux' and (platform_machine == 'x86_64' or platform_machine == 'aarch64')",
    "vllm==0.33.0; sys_platform == 'linux'",
    "vllm-router; sys_platform == 'linux'",
    # The `nixl` shim provides that namespace and dispatches on `torch.version.cuda`,
    # so with a cu13 torch it loads `nixl_cu13`. `nixl-cu13` ships the `nixl_cu13`
    # module, but vLLM imports `nixl._api`. Its metadata hard-depends on `nixl-cu12`
    # too; that variant is overridden out below (it would drag the CUDA-12 runtime
    # into the image for a module the shim would never load).
    # vLLM 0.33's NixlConnector refuses NIXL < 1.5.0 at engine start (check_nixl_version);
    # vLLM does not declare nixl, so the floor lives here.
    "nixl>=1.5.0; sys_platform == 'linux'",
    "torch==2.14.0; sys_platform == 'linux'",
    "flashinfer-python==0.7.2.post1; sys_platform == 'linux'",
    "torchvision; sys_platform == 'linux'",
    "megatron-bridge; sys_platform == 'linux'",
    "megatron-core; sys_platform == 'linux'",
    "nvidia-resiliency-ext; sys_platform == 'linux'",
    "flashinfer-jit-cache==0.7.2.post1; sys_platform == 'linux'",
    "flashinfer-jit-cache-sm100a==0.7.2.post1; sys_platform == 'linux'",
    "flashinfer-jit-cache-sm103a==0.7.2.post1; sys_platform == 'linux'",
    "flashinfer-jit-cache-sm120f==0.7.2.post1; sys_platform == 'linux'",
    "flashinfer-jit-cache-sm80==0.7.2.post1; sys_platform == 'linux'",
    "flashinfer-jit-cache-sm89==0.7.2.post1; sys_platform == 'linux'",
    "flashinfer-jit-cache-sm90a==0.7.2.post1; sys_platform == 'linux'",
    "flashinfer-jit-cache-sm110a==0.7.2.post1; sys_platform == 'linux' and platform_machine == 'aarch64'",
    "flashinfer-jit-cache-sm121a==0.7.2.post1; sys_platform == 'linux' and platform_machine == 'aarch64'",
    "flashinfer-cubin==0.7.2.post1; sys_platform == 'linux'",
    "nvidia-modelopt; sys_platform == 'linux'",
    "fast-hadamard-transform; sys_platform == 'linux'",
]

# Opt-in FlashAttention 4. NOT part of `megatron`, so the default install runs FA2.
#
# The combined `flash-attn` wheel (see [tool.uv.sources]) always carries FA4's
# `flash_attn/cute/` tree -- that is what stops it colliding with flash-attn 2's
# stale copy. But both consumers gate on the *`flash-attn-4` distribution
# metadata*, not on the tree:
#   * Transformer Engine: `get_pkg_version("flash-attn-4")` raising
#     PackageNotFoundError leaves `flash_attn_func_v4 = None`, so TE never
#     imports or dispatches to FA4.
#   * megatron-core: `HAVE_FA4` is False for the same reason.
# So installing this companion is exactly the switch that turns FA4 on, and
# leaving it out keeps FA2 as the default with no shim and no runtime patching.
#
# Markers: `< '3.15'` matches the companion's own `Requires-Python`, and the
# `platform_machine` bound keeps it off Linux arches with no combined wheel
# (there `flash-attn` resolves to plain PyPI 2.8.3.post1, which cannot satisfy the
# companion's hard dep on ==2.8.3.post1+cu.13.0.torch.2.14.fa4b28.skyrl1). Dropping
# either bound makes resolution fail outright.
#
# FA4 4.0.0b28 is a beta. TE 2.19 allows it under context parallelism for
# cp_comm_type p2p/all_gather/a2a (<= 2.18 disabled it outright), and its arch gate
# now excludes < sm90 -- so the sm86/sm87/sm89 parts (A10, L4, L40S, 4090), whose
# kernels cannot launch, are turned off by TE itself rather than needing
# SKYRL_DISABLE_FA4=1. That env var remains as an escape hatch on sm90+.
fa4 = [
    "skyrl[megatron]",
    "flash-attn-4[cu13]==4.0.0b28; sys_platform == 'linux' and (platform_machine == 'x86_64' or platform_machine == 'aarch64') and python_version < '3.15'",
]

miniswe = [
    "skyrl[skyrl-train]",
    # NOTE (sumanthrh): Needs to be a commit after https://github.com/SWE-agent/mini-swe-agent/commit/4f5d445e99d13b5482478c23508bf2fbf7c0670c
    "mini-swe-agent>=1.12.0",
    "litellm",
]
harbor = [
    "harbor[daytona,modal]==0.14.0",
]
# skycap, capturing each rollout's exact tokens in token mode (examples/train_integrations/harbor_skycap).
skycap = [
    "skycap[tokens]",
]
# Mooncake distributed KV for vLLM: the store connector (MooncakeStoreConnector,
# KV-cache offloading) and P2P PD transfer (MooncakeConnector). Provides the python
# bindings and the `mooncake_master` binary. Off-the-shelf PyPI wheel; Linux-only.
# Mooncake currently has Linux wheels through CPython 3.13 only.
mooncake = [
    "mooncake-transfer-engine-cuda13; sys_platform == 'linux' and python_version < '3.14'",
]

dev = [
    "mkdocs",
    "mkdocs-material",
    "mkdocstrings[python]>=0.24.0",
    "pymdown-extensions>=10.7",
    "pytest",
    "pytest-forked",
    "pytest-asyncio",
    "pre-commit",
    "litellm",
    "torch",
    "ty",
    "cloudpathlib[s3]",
    "alembic",
    "griffe2md",
]

[tool.setuptools]
include-package-data = true

# Runtime patch payloads (skyrl/backends/skyrl_train/patches/**/*.patch) are read
# from disk at runtime, so they must ship inside the package. `include-package-data`
# alone does not cover them
[tool.setuptools.package-data]
"*" = ["*.patch"]

[tool.setuptools.dynamic]
version = {attr = "skyrl.__version__"}

[project.scripts]
# The following is for supporting the skyrl-train dependency

[project.entry-points."vllm.general_plugins"]
# Installs the R3 pipeline-parallel config patch in every vLLM process (incl. the engine core); no-op unless
# SKYRL_R3_PP_RELAY=1 (set by the server actor for R3 with PP > 1).
skyrl_r3_pp_relay = "skyrl.backends.skyrl_train.patches.vllm.patch_routed_experts_pp_relay:vllm_general_plugin"
# Serves DeepSeek-V4.1 with vLLM's text-only (LoRA-capable) class; SKYRL_DEEPSEEK_V41_TEXT_ONLY=0 opts out.
skyrl_deepseek_v41 = "skyrl.backends.skyrl_train.patches.vllm.patch_deepseek_v41:vllm_general_plugin"
# Declares Kimi K2.5-family checkpoints LoRA-capable before vLLM 0.33's config-time LoRA support check.
skyrl_kimi_k25_lora = "skyrl.backends.skyrl_train.patches.vllm_kimi_k25_lora:vllm_general_plugin"
# Serves Beam with vLLM's BeamForCausalLM plus SupportsLoRA (vLLM 0.33's class has no LoRA support).
skyrl_beam_lora = "skyrl.backends.skyrl_train.patches.vllm.patch_beam_lora:vllm_general_plugin"

[tool.uv]
# Resolve only the Linux architectures covered by the CUDA wheels, plus the
# supported macOS development target. CUDA-only extras cannot resolve on other
# Linux architectures.
required-environments = [
    "sys_platform == 'linux' and (platform_machine == 'x86_64' or platform_machine == 'aarch64')",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]

# each backend should have separate dependencies that can potentially clash
# megatron also clashes with the jax dependency from gpu and tpu extras
conflicts = [
    [
        { extra = "jax" },
        { extra = "megatron" },
        { extra = "fsdp" },
    ],
    [
        { extra = "megatron" },
        { extra = "gpu" },
        { extra = "tpu" },
        { extra = "miniswe" },
    ]
]
# disable build isolation for megatron related dependencies
no-build-isolation-package = [
    "nv-grouped-gemm",
]
# override unnecessary dependencies and pin versions to override Megatron-Bridge
# unpinned dependencies.
override-dependencies = [
    "transformer-engine[pytorch]==2.19.0; sys_platform == 'linux'",
    "transformers>=5.6.1,<=5.16.1; sys_platform == 'linux'",
    "megatron-core>=0.16.0; sys_platform == 'linux'",
    "ml_dtypes>=0.5.0; sys_platform == 'linux'",
    # `nixl` hard-depends on both nixl-cu12 and nixl-cu13; drop the cu12 variant
    # so it doesn't pull a second, unused CUDA runtime in alongside the cu13 one.
    "nixl-cu12; sys_platform == 'never'",
    # vLLM 0.33.0 pins flashinfer-python==0.7.2.post1, while Megatron-Bridge pins
    # flashinfer-python/flashinfer-cubin==0.6.18.post1, so the flashinfer packages
    # are held here. flashinfer hard-errors when an installed cubin's version
    # differs from its own, so python, cubin and jit-cache must move together.
    #
    # flashinfer-cubin is not published to PyPI past 0.6.13, so it (like
    # flashinfer-jit-cache) comes from flashinfer's own index -- see the
    # `flashinfer` index and [tool.uv.sources] below.
    #
    # From 0.7 `flashinfer-jit-cache` is a metadata-only package that depends on
    # per-arch `flashinfer-jit-cache-sm*` packages, published only on the cu130
    # index; they are declared directly in the `fsdp` / `megatron` extras so that
    # their [tool.uv.sources] entries are honored. Both the x86_64 and the aarch64
    # (GB200/GB300) meta wheels need sm80/89/90a/100a/103a/120f; the aarch64 one
    # additionally needs sm110a and sm121a, which have no x86_64 wheels. uv applies
    # one wheel's metadata to every platform, so those two are scoped to aarch64
    # here or x86_64 fails to resolve.
    "flashinfer-python==0.7.2.post1; sys_platform == 'linux'",
    "flashinfer-jit-cache==0.7.2.post1; sys_platform == 'linux'",
    "flashinfer-jit-cache-sm110a==0.7.2.post1; sys_platform == 'linux' and platform_machine == 'aarch64'",
    "flashinfer-jit-cache-sm121a==0.7.2.post1; sys_platform == 'linux' and platform_machine == 'aarch64'",
    "flashinfer-cubin==0.7.2.post1; sys_platform == 'linux'",
    # mamba-ssm 2.3.2.post1 pins tilelang==0.1.8 and apache-tvm-ffi<=0.1.9, while
    # vLLM 0.33.0 pins tilelang==0.1.12 and apache-tvm-ffi==0.1.11. Both are
    # overridden here; these two MUST be bumped together.
    #
    # FA4 requires apache-tvm-ffi>=0.1.12, newer than either package's metadata
    # allows. tilelang 0.1.9's own bound is loose enough (`>=0.1.2,~=0.1.0`) that
    # uv happily resolves it against 0.1.12 -- and then `import tilelang` aborts
    # with `AttributeError: attribute '__dict__' of 'type' objects is not writable`
    # from a duplicate ffi field registration, taking `mamba_ssm` and `fla` (the
    # default FLA_TILELANG path) down with it. Measured:
    #     tilelang 0.1.9  + ffi 0.1.10  -> import OK   (pre-FA4 state)
    #     tilelang 0.1.9  + ffi 0.1.12  -> AttributeError
    #     tilelang 0.1.13 + ffi 0.1.12  -> import OK
    # 0.1.13 is the first tilelang whose bound (`>=0.1.11,<0.1.13`) admits 0.1.12.
    "tilelang==0.1.13; sys_platform == 'linux'",
    "apache-tvm-ffi==0.1.12; sys_platform == 'linux'",
    # vLLM 0.33.0 pins nvidia-cutlass-dsl==4.8.0 and quack-kernels==0.6.5. The torch-2.14
    # combined FA4 `flash-attn` wheels pin the same versions; held here so the two can
    # never drift apart (the torch-2.13 combined wheels pinned quack-kernels 0.6.4).
    "nvidia-cutlass-dsl[cu13]==4.8.0; sys_platform == 'linux'",
    "quack-kernels[cu13]==0.6.5; sys_platform == 'linux'",
    # vLLM 0.33.0 pins torch==2.14.0. Held here so megatron-bridge / mamba-ssm metadata cannot
    # pull a different torch under the CUDA extension wheels, which are built for exactly 2.14.0.
    "torch==2.14.0; sys_platform == 'linux'",
    # torchvision is NOT stable-ABI (unlike vLLM), and each release hard-pins one
    # torch: 0.29.0 wants torch 2.14.0, 0.28.0 wants 2.13.0.
    "torchvision==0.29.0; sys_platform == 'linux'",
]

[tool.uv.extra-build-dependencies]
flash-attn = [{requirement = "torch", match-runtime = true}]
fast-hadamard-transform = ["torch==2.14.0", "ninja"]

[tool.uv.extra-build-variables]
flash-attn = { FLASH_ATTENTION_SKIP_CUDA_BUILD = "TRUE"}
fast-hadamard-transform = { FAST_HADAMARD_TRANSFORM_FORCE_BUILD = "TRUE"}
# SkyRL only uses NVRx's async checkpointing. Its CUPTI straggler-detection extension
# only adds CUPTI's include dir and fails with `cuda.h: No such file or directory` unless
# the toolkit's headers are on the default include path, so skip building it.
nvidia-resiliency-ext = { STRAGGLER_DET_SKIP_CUPTI_EXT_BUILD = "1" }


[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "jax-tpu"
url = "https://storage.googleapis.com/jax-releases/libtpu_releases.html"

[[tool.uv.index]]
name = "flashinfer-cu130"
url = "https://flashinfer.ai/whl/cu130"
explicit = true

# flashinfer's CUDA-agnostic index. flashinfer-cubin is a pure-python wheel
# (py3-none-any) that stopped being published to PyPI after 0.6.13, so it is
# sourced here instead; the cu130 index above only carries flashinfer-jit-cache.
[[tool.uv.index]]
name = "flashinfer"
url = "https://flashinfer.ai/whl/"
explicit = true

# Astral's prebuilt GPU wheels (https://wheels.astral.sh). cu130 to match torch's
# CUDA variant. Wheels are published per (CUDA, torch) pair and carry that pair in
# a local version segment (e.g. `+cu.13.0.torch.2.11`), so the exact build must be
# pinned in the requirement — see the pins in the `fsdp` / `megatron` extras.
[[tool.uv.index]]
name = "astral-cu130"
url = "https://wheels.astral.sh/simple/cu130/"
explicit = true

[tool.uv.sources]
skyrl-gym = { path = "./skyrl-gym", editable = true }
skycap = { path = "./skycap", editable = true }
# Match torch's CUDA variant (cu130).
flashinfer-jit-cache = { index = "flashinfer-cu130", marker = "sys_platform == 'linux'" }
# flashinfer 0.7 splits the JIT cache into per-arch packages, published only on its cu130 index.
flashinfer-jit-cache-sm100a = { index = "flashinfer-cu130", marker = "sys_platform == 'linux'" }
flashinfer-jit-cache-sm103a = { index = "flashinfer-cu130", marker = "sys_platform == 'linux'" }
flashinfer-jit-cache-sm120f = { index = "flashinfer-cu130", marker = "sys_platform == 'linux'" }
flashinfer-jit-cache-sm80 = { index = "flashinfer-cu130", marker = "sys_platform == 'linux'" }
flashinfer-jit-cache-sm89 = { index = "flashinfer-cu130", marker = "sys_platform == 'linux'" }
flashinfer-jit-cache-sm90a = { index = "flashinfer-cu130", marker = "sys_platform == 'linux'" }
