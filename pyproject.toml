[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["skyrl*"]

[project]
name = "skyrl"
dynamic = ["version"]
description = "Unified API for training and inference"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "datasets>=4.0.0",
    "pillow>=11.3.0",
    "rich>=14.1.0",
    "safetensors>=0.6.2",
    "tokenizers>=0.21.2",
    "transformers>=5.6.1,<=5.8.0",
    "typer>=0.17.4",
    "peft==0.18.1",
    "hf_transfer",
    "cloudpathlib>=0.23.0",
    "zstandard>=0.23.0",
    "xxhash>=3.0.0",
]

[project.optional-dependencies]
gpu = [
    "jax[cuda13]>=0.7.2; sys_platform == 'linux'",
]

tpu = [
    "jax[tpu]>=0.7.2; sys_platform == 'linux'",
]

tinker = [
    "tinker>=0.3.0,<=0.24.1",
    "fastapi[standard]",
    "sqlmodel",
    "sqlalchemy[asyncio]",
    "aiosqlite",
    "asyncpg",
    "psycopg2-binary",
]

ray = [
    "ray[default]==2.57.0",
]

aws = [
    "cloudpathlib[s3]",
    "s5cmd>=0.3.3; sys_platform == 'linux'",
]

gcp = [
    "cloudpathlib[gs]",
]

azure = [
    "cloudpathlib[azure]",
]

# The extras "jax", "fsdp", and "megatron" are the dependencies the
# engine needs for --backend="jax", --backend="fsdp", and --backend="megatron",
# respectively.

jax = [
    "jax>=0.8,<1.0",
    "flax>=0.12.2",
    "optax>=0.2.5",
]

skyrl-train = [
    "loguru",
    "tqdm",
    "ninja",
    "tensorboard",
    "func_timeout",
    "hydra-core==1.3.2",
    "accelerate",
    "torchdata",
    "omegaconf",
    "ray==2.57.0",
    "peft==0.18.1",
    "debugpy==1.8.0",
    "hf_transfer",
    "wandb",
    "datasets>=4.0.0",
    "tensordict",
    "jaxtyping",
    "skyrl-gym",
    "flash-attn==2.8.3+cu.13.0.torch.2.11; sys_platform == 'linux'",
    "polars",
    "s3fs",
    "s5cmd>=0.3.3; sys_platform == 'linux'",
    "gcsfs",
    "fastapi",
    "orjson>=3.11.9",
    "pybase64>=1.4.2",
    "uvicorn",
    "vllm-router; sys_platform == 'linux'",
    "pybind11",
    "setuptools",
    # The `nixl` shim provides that namespace and dispatches on `torch.version.cuda`,
    # so with a cu13 torch it loads `nixl_cu13`. `nixl-cu13` ships the `nixl_cu13`
    # module, but vLLM imports `nixl._api`. Its metadata hard-depends on `nixl-cu12`
    # too; that variant is overridden out below (it would drag the CUDA-12 runtime
    # into the image for a module the shim would never load).
    "nixl; sys_platform == 'linux'",
]

fsdp = [
    "skyrl[skyrl-train]",
    "vllm==0.26.0; sys_platform == 'linux'",
    "vllm-router; sys_platform == 'linux'",
    # The `nixl` shim provides that namespace and dispatches on `torch.version.cuda`,
    # so with a cu13 torch it loads `nixl_cu13`. `nixl-cu13` ships the `nixl_cu13`
    # module, but vLLM imports `nixl._api`. Its metadata hard-depends on `nixl-cu12`
    # too; that variant is overridden out below (it would drag the CUDA-12 runtime
    # into the image for a module the shim would never load).
    "nixl; sys_platform == 'linux'",
    "flash-linear-attention; sys_platform == 'linux'",
    "causal-conv1d==1.6.2.post1+cu.13.0.torch.2.11; sys_platform == 'linux'",
    "flash-attn==2.8.3+cu.13.0.torch.2.11; sys_platform == 'linux'",
    "torch==2.11.0; sys_platform == 'linux'",
    "flashinfer-python==0.6.13; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "flashinfer-jit-cache==0.6.13; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "flashinfer-cubin==0.6.13; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "torchvision; sys_platform == 'linux'",
]

megatron = [
    "skyrl[skyrl-train]",
    "transformer-engine[pytorch]==2.16.0; sys_platform == 'linux'",
    # Declared directly (not just via transformer-engine[pytorch]) so the
    # [tool.uv.sources] index below is honored — uv ignores sources for
    # transitive-only packages, which would otherwise fall back to the PyPI sdist.
    "transformer-engine-torch==2.16.0+cu.13.0.torch.2.11; sys_platform == 'linux'",
    # TE core CUDA lib (libtransformer_engine.so). Declared directly because the
    # meta package only pulls a core via its `core*` extras, which we don't request
    # — without it the meta package's sanity check fails with "Found empty
    # `transformer-engine` meta package installed". cu13 is the only core Astral
    # publishes on the cu130 index, and it is what `transformer-engine-torch`'s
    # metadata requires there, so the two agree without an override.
    "transformer-engine-cu13==2.16.0+cu.13.0; sys_platform == 'linux'",
    "flash-attn==2.8.3+cu.13.0.torch.2.11; sys_platform == 'linux'",
    "flash-linear-attention; sys_platform == 'linux'",
    "causal-conv1d==1.6.2.post1+cu.13.0.torch.2.11; sys_platform == 'linux'",
    "mamba-ssm==2.3.2.post1+cu.13.0.torch.2.11; sys_platform == 'linux'",
    "vllm==0.26.0; sys_platform == 'linux'",
    "vllm-router; sys_platform == 'linux'",
    # The `nixl` shim provides that namespace and dispatches on `torch.version.cuda`,
    # so with a cu13 torch it loads `nixl_cu13`. `nixl-cu13` ships the `nixl_cu13`
    # module, but vLLM imports `nixl._api`. Its metadata hard-depends on `nixl-cu12`
    # too; that variant is overridden out below (it would drag the CUDA-12 runtime
    # into the image for a module the shim would never load).
    "nixl; sys_platform == 'linux'",
    "torch==2.11.0; sys_platform == 'linux'",
    "flashinfer-python==0.6.13; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "torchvision; sys_platform == 'linux'",
    # megatron-bridge requires Python 3.12+; pin megatron-core to the same
    # constraint so both packages are consistently available (or absent).
    "megatron-bridge; sys_platform == 'linux' and python_version >= '3.12'",
    "megatron-core; sys_platform == 'linux' and python_version >= '3.12'",
    "flashinfer-jit-cache==0.6.13; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "flashinfer-cubin==0.6.13; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "nvidia-modelopt; sys_platform == 'linux'",
]

miniswe = [
    "skyrl[skyrl-train]",
    # NOTE (sumanthrh): Needs to be a commit after https://github.com/SWE-agent/mini-swe-agent/commit/4f5d445e99d13b5482478c23508bf2fbf7c0670c
    "mini-swe-agent>=1.12.0",
    "litellm",
]
harbor = [
    "harbor[daytona,modal]; python_version >= '3.12'",
]
# Mooncake distributed KV for vLLM: the store connector (MooncakeStoreConnector,
# KV-cache offloading) and P2P PD transfer (MooncakeConnector). Provides the python
# bindings and the `mooncake_master` binary. Off-the-shelf PyPI wheel; Linux-only.
mooncake = [
    "mooncake-transfer-engine-cuda13; sys_platform == 'linux'",
]

dev = [
    "mkdocs",
    "mkdocs-material",
    "mkdocstrings[python]>=0.24.0",
    "pymdown-extensions>=10.7",
    "pytest",
    "pytest-forked",
    "pytest-asyncio",
    "pre-commit",
    "litellm",
    "torch",
    "ty",
    "cloudpathlib[s3]",
    "alembic",
    "griffe2md",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = {attr = "skyrl.__version__"}

[project.scripts]
# The following is for supporting the skyrl-train dependency

[tool.uv]
# Resolve for both Linux (production) and macOS (dev)
required-environments = [
    "sys_platform == 'linux'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]

# each backend should have separate dependencies that can potentially clash
# megatron also clashes with the jax dependency from gpu and tpu extras
conflicts = [
    [
        { extra = "jax" },
        { extra = "megatron" },
        { extra = "fsdp" },
    ],
    [
        { extra = "megatron" },
        { extra = "gpu" },
        { extra = "tpu" },
        { extra = "miniswe" },
    ]
]
# disable build isolation for megatron related dependencies
no-build-isolation-package = [
    "nv-grouped-gemm",
]
# override unnecessary dependencies and pin versions to override Megatron-Bridge
# unpinned dependencies.
override-dependencies = [
    "nvidia-resiliency-ext; sys_platform == 'never'",
    # megatron-bridge hard dependency that publishes no wheels, so it
    # would compile CUDA on every install and on every Ray runtime-env sync.
    # megatron-core only uses it for the experimental DSA (DeepSeek Sparse
    # Attention) variant, behind a `try: from fast_hadamard_transform import ...
    # except ImportError` guard, so dropping it keeps the pre-bump behavior
    # exactly. Remove this override (and add a git source + build config -- the
    # PyPI sdist is documented upstream as incomplete) if DSA is ever needed.
    "fast-hadamard-transform; sys_platform == 'never'",
    "transformer-engine[pytorch]==2.16.0; sys_platform == 'linux'",
    "transformers>=5.6.1,<=5.8.0; sys_platform == 'linux'",
    "megatron-core>=0.16.0; sys_platform == 'linux' and python_version >= '3.12'",
    "ml_dtypes>=0.5.0; sys_platform == 'linux'",
    # `nixl` hard-depends on both nixl-cu12 and nixl-cu13; drop the cu12 variant
    # so it doesn't pull a second, unused CUDA runtime in alongside the cu13 one.
    "nixl-cu12; sys_platform == 'never'",
    # Megatron-Bridge pins flashinfer-python==0.6.8.post1, which conflicts with
    # our pin. vLLM 0.26.0's metadata asks for 0.6.14, but flashinfer-cubin was
    # never released at 0.6.14 and flashinfer hard-errors when cubin's version
    # differs from its own, so all three are held at 0.6.13 -- the version vLLM
    # 0.26.0 was developed against. It must be >=0.6.13: older flashinfer rejects
    # the `layout_code` vLLM's allreduce+RMS fusion pass hands the MNNVL backend
    # ("MNNVL AllReduce does not support quantization fusion").
    "flashinfer-python==0.6.13; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "flashinfer-jit-cache==0.6.13; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "flashinfer-cubin==0.6.13; sys_platform == 'linux' and platform_machine == 'x86_64'",
    # mamba-ssm 2.3.2.post1 pins tilelang==0.1.8 and apache-tvm-ffi<=0.1.9, while
    # vLLM 0.26.0 pins tilelang==0.1.9 and apache-tvm-ffi==0.1.10. Both overrides
    # hold these at the versions the lock already resolved to before mamba-ssm moved
    # to the Astral wheel, so they only relax mamba-ssm's pins — no other package's
    # resolved version changes.
    "tilelang==0.1.9; sys_platform == 'linux'",
    "apache-tvm-ffi==0.1.10; sys_platform == 'linux'",
    # vLLM allows xgrammar>=0.2.1,<1.0.0, but 0.2.4/0.2.5 never published a
    # cp312 linux x86_64 wheel (only cp310/cp311 + aarch64/macOS), so resolving
    # to them breaks install on x86_64 py3.12. 0.2.3 has the wheel.
    "xgrammar==0.2.3",
    # mamba-ssm 2.3.2.post1 pins tilelang==0.1.8 while vLLM pins ==0.1.9.
    "tilelang==0.1.9; sys_platform == 'linux'",
    # mamba-ssm 2.3.2.post1 caps apache-tvm-ffi at <=0.1.9 while vLLM 0.26.0 pins ==0.1.10. 
    # Without this, resolution fails outright (the py>=3.14 split has no preferences to fall back on)
    "apache-tvm-ffi==0.1.10; sys_platform == 'linux'",
]

[tool.uv.extra-build-dependencies]
flash-attn = [{requirement = "torch", match-runtime = true}]

[tool.uv.extra-build-variables]
flash-attn = { FLASH_ATTENTION_SKIP_CUDA_BUILD = "TRUE"}


[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "jax-tpu"
url = "https://storage.googleapis.com/jax-releases/libtpu_releases.html"

[[tool.uv.index]]
name = "flashinfer-cu130"
url = "https://flashinfer.ai/whl/cu130"
explicit = true

# Astral's prebuilt GPU wheels (https://wheels.astral.sh). cu130 to match torch's
# CUDA variant. Wheels are published per (CUDA, torch) pair and carry that pair in
# a local version segment (e.g. `+cu.13.0.torch.2.11`), so the exact build must be
# pinned in the requirement — see the pins in the `fsdp` / `megatron` extras.
[[tool.uv.index]]
name = "astral-cu130"
url = "https://wheels.astral.sh/simple/cu130/"
explicit = true

[tool.uv.sources]
skyrl-gym = { path = "./skyrl-gym", editable = true }
# Match torch's CUDA variant (cu130).
flashinfer-jit-cache = { index = "flashinfer-cu130", marker = "sys_platform == 'linux'" }

# torch-2.11 builds of these aren't published on PyPI, so they come from Astral's
# prebuilt GPU index instead of wheels built by hand on personal forks. Astral
# publishes cp310-cp314 for both x86_64 and aarch64, so no python/arch marker is
# needed beyond the platform — this covers aarch64/GB200 with the same official
# wheels, retiring the separate hand-built aarch64 artifacts these replace.
#
# Astral versions each wheel with the (CUDA, torch) pair it was built against, in a
# PEP 440 local segment (`+cu.13.0.torch.2.11`), so the exact build is pinned in the
# requirement rather than here — see the `fsdp` / `megatron` extras.
#
# flash-attn must stay at exactly 2.8.3, NOT 2.8.3.post1: TE gates flash-attn on
# `max_version = 2.8.3` and 2.8.3.post1 > 2.8.3. TE >= 2.16 strips the local segment
# before comparing (`PkgVersion(...).public`); TE 2.11 did not, which is why this
# previously had to be a fork wheel with the local version stripped from METADATA —
# otherwise TE rejected it and silently fell back to broken unfused attention.
flash-attn = { index = "astral-cu130", marker = "sys_platform == 'linux'" }
causal-conv1d = { index = "astral-cu130", marker = "sys_platform == 'linux'" }
mamba-ssm = { index = "astral-cu130", marker = "sys_platform == 'linux'" }
# The TE trio must come from Astral as a set. Astral versions the core and torch
# wheels with local segments (2.16.0+cu.13.0 / +cu.13.0.torch.2.11) while the meta
# package stays plain 2.16.0, and upstream TE asserts raw string equality across the
# three at import. Astral's meta wheel carries a patch comparing base versions
# instead, so mixing their core/torch wheels with the PyPI meta package fails.
transformer-engine = { index = "astral-cu130", marker = "sys_platform == 'linux'" }
transformer-engine-cu13 = { index = "astral-cu130", marker = "sys_platform == 'linux'" }
transformer-engine-torch = { index = "astral-cu130", marker = "sys_platform == 'linux'" }
# CUDA torch on Linux, CPU torch on macOS (must match skyrl-train).
# Linux uses the cu130 index (torch 2.11 wheels are published there).
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
]
torchvision = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
]
harbor = { git = "https://github.com/laude-institute/harbor", rev = "3de07a0e01f3368921766437fc7afece3ddec23d" }
# megatron-bridge main branch: latest as of 8/13/26
megatron-bridge = {git = "https://github.com/NVIDIA-NeMo/Megatron-Bridge", rev = "2b8cb21d90548a5796c748f1986c77fc1cfe2417", marker = "sys_platform == 'linux'"}
# megatron-core must match the `3rdparty/Megatron-LM` submodule pin of the
# megatron-bridge rev above -- that is the only megatron-core commit Bridge's
# own CI validates against. Bump the two together, reading the submodule rev with
# `git ls-tree <bridge-rev> 3rdparty/Megatron-LM`. This one is on the Megatron-LM
# main branch (https://github.com/NVIDIA/Megatron-LM/tree/main), dated 8/12/26.
megatron-core = {git = "https://github.com/NVIDIA/Megatron-LM", rev = "14346b65a2d0790e451919858f7771078105c5f0", marker = "sys_platform == 'linux'"}
# NOTE (sumanthrh): This custom wheel of vllm-router includes a fix for /chat/completions endpoint: https://github.com/vllm-project/router/pull/162  on top of 0.1.14
# TODO (sumanthrh): Remove this after 0.1.15 vllm-router release
vllm-router = [
    { url = "https://github.com/SumanthRH/router/releases/download/0.1.14.post1/vllm_router-0.1.14.post1-cp38-abi3-manylinux_2_35_x86_64.whl", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
    { url = "https://github.com/SumanthRH/router/releases/download/0.1.14.post1/vllm_router-0.1.14.post1-cp38-abi3-manylinux_2_28_aarch64.whl", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" }
]


[tool.pytest.ini_options]
# Registering markers silences PytestUnknownMarkWarning and makes `-m` selection
# in ci/gpu_ci_run_*.sh explicit rather than relying on free-form names.
markers = [
    "vllm: requires the vllm package (present under the fsdp/megatron extras)",
    "megatron: requires the megatron extra",
    "megatron_models: long-running Megatron model-parity tests",
    "b300: opt-in tests that require B300 GPUs",
    "integrations: third-party integration tests with extra install steps",
    "mooncake: requires the mooncake extra (mooncake-transfer-engine)",
]

[tool.black]
line-length = 120
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.flake8]
max-line-length = 120
max-doc-length = 120
extend-ignore = [
    # Default ignored errors by flake8
    "E121", "E123", "E126", "E226", "E24", "E704",
    # F401 module imported but unused
    "F401",
    # E203 whitespace before ':' (conflict with black)
    "E203",
    # E231 missing whitespace after ',' (conflict with black)
    "E231",
    # E501 line too long (conflict with black)
    "E501",
    # E741 do not use variables named 'l', 'O', or 'I'
    "E741",
    # W503 line break before binary operator (conflict with black)
    "W503",
    # W504 line break after binary operator (conflict with black)
    "W504",
    # W505 doc line too long (conflict with black)
    "W505",
    # W605 invalid escape sequence 'x' (conflict with latex within docs)
    "W605",
]

[tool.ruff]
exclude = [
    "skyrl-agent/",
    "examples/",
]

[tool.ruff.lint]
extend-select = ["I"]
ignore = [
    "F722" # Syntax error in annotation - ignored because this doesn't play well with jaxtyping
]

[tool.ruff.lint.isort]
known-first-party = ["skyrl", "skyrl_gym"]
