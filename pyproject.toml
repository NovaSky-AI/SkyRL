# CUDA extension wheels for torch 2.14.0 + CUDA 13.
#
# mamba-ssm, causal-conv1d and transformer-engine-torch come from Astral's cu130 index, which
# publishes builds per (CUDA, torch) pair for cp310-cp314 on x86_64 and aarch64. Their wheels
# require the matching torch, so `causal-conv1d==1.7.0` resolves to the torch-2.14 build without
# naming its local segment, which keeps the `fsdp` extra installable from PyPI. causal-conv1d is 1.7.0 there
# (Astral builds no 1.6.x for torch >= 2.13). Check for a newer torch with:
#   curl -sL https://wheels.astral.sh/simple/cu130/mamba-ssm/ | grep -o 'torch\.2\.[0-9]*' | sort -uV
#
# All three Transformer Engine packages come from Astral, as a set. transformer-engine-torch
# hard-depends on Astral's TE core build (`2.19.0+cu.13.0`), and only Astral's TE meta package can
# load that pair: its import-time sanity check compares base versions (local segment stripped),
# while PyPI's `transformer-engine` 2.19.0 requires the three version strings to be identical and
# fails every Megatron import with "Transformer Engine package version mismatch".
causal-conv1d = { index = "astral-cu130", marker = "sys_platform == 'linux'" }
mamba-ssm = { index = "astral-cu130", marker = "sys_platform == 'linux'" }
transformer-engine-torch = { index = "astral-cu130", marker = "sys_platform == 'linux'" }
transformer-engine-cu13 = { index = "astral-cu130", marker = "sys_platform == 'linux'" }
transformer-engine = { index = "astral-cu130", marker = "sys_platform == 'linux'" }

# flash-attn: combined FA2+FA4 wheels, repacked from Astral's
# `2.8.3.post1+cu.13.0.torch.2.14` FA2 wheels (compiled extension byte-identical) with the stale
# `flash_attn/cute/` tree replaced by FA4 4.0.0b28's:
#   https://github.com/NovaSky-AI/skyrl-wheels/releases/tag/cu13torch2.14-fa4b28-skyrl1
# Embedded cubins: sm_80 90 100 120. TE 2.19 gates flash-attn on `version < 2.8.4` (public part
# only), so 2.8.3.post1 passes.
# WARNING: every `flash-attn` entry below MUST stay a combined FA2+FA4 wheel. Astral's plain
# FA2 wheel still ships a stale `flash_attn/cute/` (21 files) built against the
# nvidia-cutlass-dsl 4.0/4.1 API, and megatron-core imports that tree unconditionally -- before
# its own `flash-attn-4` metadata check -- under a bare `except ImportError`. Against
# cutlass-dsl 4.6+ the stale tree raises `AttributeError: ThrMma`, which escapes that handler
# and takes down every `megatron.core.transformer.attention` import. Rebuild combined wheels
# instead (recipe and manifests are attached to the release).
flash-attn = [
