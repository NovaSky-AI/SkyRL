name: SkyRL-JAX-GPU

# Same scoping rationale as SkyRL-JAX-CPU (see cpu_jax.yaml), minus
# `pyproject.toml`/`uv.lock`: this workflow submits a paid Anyscale GPU job, and
# dependency bumps are already covered on the free CPU runner. Use
# `workflow_dispatch` if you want a GPU run for a resolution change.
#
# Keep the two `paths:` lists below in sync -- GitHub Actions does not support
# YAML anchors.
#
# Three ways this job starts, same shape as the other Anyscale workflows (see
# gpu_skyrl.yaml):
# - `push` to `main`, and PRs whose head branch lives on NovaSky-AI/SkyRL,
#   auto-run (paths-gated above). Same-repo `pull_request` runs receive the
#   repo's secrets.
# - Fork PRs never run on the plain `pull_request` trigger: GitHub withholds
#   repo secrets from fork-triggered events, so they would always fail at
#   Anyscale auth. Instead a maintainer applies the `run_jax_gpu_ci` label and
#   the `pull_request_target` trigger below runs the job with secrets.
# - `workflow_dispatch` for anything else.
on:
  push:
    branches: [ main ]
    paths:
      - 'skyrl/tx/**'
      - 'skyrl/backends/backend.py'
      - 'skyrl/backends/jax.py'
      - 'skyrl/backends/ray_jax.py'
      - 'skyrl/utils/**'
      - 'skyrl/tinker/types.py'
      - 'tests/tx/**'
      - 'tests/backends/test_jax_backend.py'
      - 'ci/anyscale_gpu_ci_jax.yaml'
      - 'ci/gpu_ci_run_jax.sh'
      - 'ci/submit_anyscale_job.sh'
      - '.github/workflows/gpu_jax.yaml'
  pull_request:
    paths:
      - 'skyrl/tx/**'
      - 'skyrl/backends/backend.py'
      - 'skyrl/backends/jax.py'
      - 'skyrl/backends/ray_jax.py'
      - 'skyrl/utils/**'
      - 'skyrl/tinker/types.py'
      - 'tests/tx/**'
      - 'tests/backends/test_jax_backend.py'
      - 'ci/anyscale_gpu_ci_jax.yaml'
      - 'ci/gpu_ci_run_jax.sh'
      - 'ci/submit_anyscale_job.sh'
      - '.github/workflows/gpu_jax.yaml'
  # Fork PRs ride this trigger, not the plain one above: `pull_request_target`
  # runs in the base-repo context, so the job below can reach the Anyscale
  # secrets a fork `pull_request` event never gets. See the job `if:` for the
  # label gating.
  pull_request_target:
    types: [labeled]
  workflow_dispatch:

permissions:
  checks: write
  contents: read

concurrency:
  group: skyrl-gpu-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  skyrl_jax_gpu_tests:
    # Gate on the label that fired this event. `types: [labeled]` delivers one
    # event per label added, and `github.event.label.name` tests only the label
    # that fired, so labelling in bulk launches one run here, not one per label.
    # Plain `pull_request` runs are restricted to same-repo branches: fork PRs
    # get no secrets there (see the trigger comment) and would always fail at
    # Anyscale auth.
    if: >
      github.repository == 'NovaSky-AI/SkyRL' &&
      (
        (github.event_name == 'push' || github.event_name == 'workflow_dispatch') ||
        (github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository) ||
        (github.event_name == 'pull_request_target' &&
          !github.event.pull_request.draft &&
          github.event.label.name == 'run_jax_gpu_ci')
      )
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: .

    steps:
      - uses: actions/checkout@v4
        with:
          # Plain `pull_request` runs keep their default merge-ref checkout
          # (what would actually land); in the fallback below, `github.ref` is
          # `refs/pull/<n>/merge` for that event. `pull_request_target` would
          # instead check out the base ref, so it takes the PR head explicitly
          # here -- the Anyscale job uploads this working dir. Fork code only
          # gets this far after a maintainer applies the gating label; don't
          # leave the base repo token on disk for it.
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.ref }}
          allow-unsafe-pr-checkout: true
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v6
        with:
          activate-environment: true
      - name: Install dependencies
        run: uv pip install anyscale==0.26.103 typer==0.9.0
      - name: Install envsubst
        run: sudo apt-get update && sudo apt-get install -y gettext-base
      - name: GPU tests
        env:
          ANYSCALE_CLI_TOKEN: ${{ secrets.ANYSCALE_CLI_TOKEN }}
          ANYSCALE_HOST: https://console.anyscale.com
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          envsubst < ci/anyscale_gpu_ci_jax.yaml > ci/anyscale_gpu_ci_jax_envsubst.yaml
          COMMIT_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          JOB_NAME="skyrl-jax-gpu-ci-${COMMIT_SHA:0:7}-${{ github.run_id }}-${{ github.run_attempt }}"
          bash ci/submit_anyscale_job.sh ci/anyscale_gpu_ci_jax_envsubst.yaml "$JOB_NAME" 10000
          rm -f ci/anyscale_gpu_ci_jax_envsubst.yaml
      # Cancelling the run stops the runner, not the cluster. GitHub still runs
      # `if: cancelled()` steps, so this is where an orphaned GPU job gets reaped.
      - name: Terminate Anyscale jobs on cancellation
        if: cancelled()
        env:
          ANYSCALE_CLI_TOKEN: ${{ secrets.ANYSCALE_CLI_TOKEN }}
          ANYSCALE_HOST: https://console.anyscale.com
        run: bash ci/terminate_anyscale_jobs.sh
