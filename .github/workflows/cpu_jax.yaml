name: SkyRL-JAX-CPU

# The JAX/tx backend is a mostly unmaintained code path, so this workflow is
# scoped to the files that can actually break it: `skyrl/tx`, the JAX backend
# adapters, the handful of shared modules tx imports, and the dependency
# resolution surface. Everything else that used to run here (the Tinker API
# server tests and `tests/utils`) moved to SkyRL-CPU, which runs on every PR.
#
# Keep the two `paths:` lists below in sync -- GitHub Actions does not support
# YAML anchors.
on:
  push:
    branches: [ main ]
    paths:
      - 'skyrl/tx/**'
      - 'skyrl/backends/backend.py'
      - 'skyrl/backends/jax.py'
      - 'skyrl/backends/ray_jax.py'
      - 'skyrl/benchmarks/**'
      # tx imports these directly -- see `skyrl/tx/utils/models.py` and the loaders.
      - 'skyrl/utils/**'
      - 'skyrl/tinker/types.py'
      - 'tests/tx/**'
      - 'tests/backends/test_jax_backend.py'
      # Resolution changes are the main way a JAX break sneaks in without anyone
      # touching tx, and this runner is free, so keep them in scope.
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/cpu_jax.yaml'
  pull_request:
    paths:
      - 'skyrl/tx/**'
      - 'skyrl/backends/backend.py'
      - 'skyrl/backends/jax.py'
      - 'skyrl/backends/ray_jax.py'
      - 'skyrl/benchmarks/**'
      - 'skyrl/utils/**'
      - 'skyrl/tinker/types.py'
      - 'tests/tx/**'
      - 'tests/backends/test_jax_backend.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/cpu_jax.yaml'
  workflow_dispatch:

permissions:
  checks: write   # for status checks to appear
  contents: read

# Cancel runs for previous commits on the same branch
concurrency:
  group: skyrl-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  skyrl_jax_tests:
    # CI runs only in the upstream repo. This workflow needs no secrets and would pass
    # on a fork, but fork CI is off by policy -- fork PRs are tested here, in the base
    # repository's context.
    if: github.repository == 'NovaSky-AI/SkyRL'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: .
    steps:
    - uses: actions/checkout@v4
    - name: Install uv
      # Use the action rather than the curl installer: on GitHub-hosted runners it
      # also restores/saves ~/.cache/uv between runs, which matters here because
      # this job resolves several distinct extra sets (tinker/jax/dev).
      uses: astral-sh/setup-uv@v6
      with:
        enable-cache: true
    - name: Run pytest
      run: |
        uv run --extra tinker --extra jax --extra dev --with transformers==5.2.0 pytest --forked -s tests/tx/models/test_qwen3_5.py
        uv run --extra tinker --extra jax --extra dev pytest --forked -s tests/tx tests/backends/test_jax_backend.py --ignore=tests/tx/gpu --ignore=tests/tx/models/test_qwen3_5.py
    - name: Run engine benchmarks
      run: |
        uv run --extra tinker --extra dev python skyrl/benchmarks/benchmark_engine.py --base-model trl-internal-testing/tiny-Qwen3ForCausalLM --backend-config '{"max_lora_adapters": 3, "max_lora_rank": 1}' --num-warmup-steps 1 --num-steps 1 --num-requests 1 --seq-len 8 --sample-max-tokens 16
